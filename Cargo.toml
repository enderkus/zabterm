[package]
name = "zabterm"
version = "0.1.0"
edition = "2024"
description = "A beautiful terminal UI for Zabbix"
license = "MIT"
repository = "https://github.com/enderkus/zabterm"
readme = "README.md"
keywords = ["zabbix", "tui", "monitoring", "omarchy"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[[bin]]
name = "zabterm"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
